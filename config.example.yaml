data_dir: ./data
runs_dir: ./runs
reports_dir: ./reports
# Optional override for cross-run memory (default: <runs_dir>/_lab)
# lab_index_dir: ./runs/_lab

tqg_api:
  # Provider MCP URL (HTTPS). Override at runtime: export TQG_API_BASE_URL=http://127.0.0.1:8787/v1
  base_url: https://tqg-mcp.vkotopoulos.com/v1
  api_key_env: TQG_API_KEY

defaults:
  oos_start: "2025-01-01"
  fee: 0.00045
  slippage: 0.0005
  interval: "1d"
